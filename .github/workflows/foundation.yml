name: Foundation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare validation environment
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: -r scripts/requirements.txt
      - name: Validate repository and datasets
        run: .venv/bin/python scripts/check.py
      - name: Exercise failure cases
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
