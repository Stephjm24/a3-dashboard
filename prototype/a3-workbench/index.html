<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<title>A3 Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: built on the NHS.UK design system (frontend and service manual): NHS Blue header band, square 2px-bordered inputs, green primary button with a hard shadow, yellow focus, tags and inset text. The A3 itself is a ruled engineering sheet: a gridded title block, numbered boxes in reading order, Plan on the left, Do / Check / Act and Insights on the right. A poster view lays the same A3 out to fill an A3 landscape page for the PDF. */
:root {
  --bg: #f0f4f5;            /* NHS grey 5 */
  --paper: #ffffff;
  --ink: #212b32;           /* NHS text */
  --muted: #4c6272;         /* NHS secondary text */
  --line: #d8dde0;          /* NHS grey 4 */
  --line-strong: #aeb7bd;   /* NHS grey 3 */
  --rule: #212b32;
  --accent: #005eb8;        /* NHS Blue */
  --accent-strong: #003087; /* NHS Dark Blue */
  --on-accent: #ffffff;
  --accent-soft: #e8edee;   /* NHS pale grey */
  --tint: #e0ecf7;          /* pale blue tint */
  --gap: #d5281b;           /* NHS red */
  --gap-soft: rgba(213, 40, 27, 0.13);
  --good: #007f3b;          /* NHS green */
  --good-dark: #00401e;
  --warn: #ffb81c;          /* NHS warm yellow */
  --warn-ink: #6b4c00;
  --focus: #ffeb3b;         /* NHS focus yellow */
  --focus-ink: #212b32;
  --field: #ffffff;
  --f-display: Frutiger, "Frutiger W01", Arial, "Helvetica Neue", Helvetica, sans-serif;
  --f-body: Frutiger, "Frutiger W01", Arial, "Helvetica Neue", Helvetica, sans-serif;
  --f-mono: Frutiger, "Frutiger W01", Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1820; --paper: #15232e; --ink: #f0f4f5; --muted: #aab8c3; --line: #2b3d4b; --line-strong: #4c6272; --rule: #d8dde0;
    --accent: #41b6e6; --accent-strong: #8fd3f2; --on-accent: #0d1820; --accent-soft: #1d2f3c; --tint: #17344a;
    --gap: #ff7b6e; --gap-soft: rgba(255, 123, 110, 0.2); --good: #4cc38a; --good-dark: #1d6b44; --warn: #ffb81c; --warn-ink: #ffd56b;
    --focus: #ffeb3b; --focus-ink: #0d1820; --field: #0f1c25; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1820; --paper: #15232e; --ink: #f0f4f5; --muted: #aab8c3; --line: #2b3d4b; --line-strong: #4c6272; --rule: #d8dde0;
  --accent: #41b6e6; --accent-strong: #8fd3f2; --on-accent: #0d1820; --accent-soft: #1d2f3c; --tint: #17344a;
  --gap: #ff7b6e; --gap-soft: rgba(255, 123, 110, 0.2); --good: #4cc38a; --good-dark: #1d6b44; --warn: #ffb81c; --warn-ink: #ffd56b;
  --focus: #ffeb3b; --focus-ink: #0d1820; --field: #0f1c25; color-scheme: dark;
}
/* Print colours: the poster and the PDF are always light. */
.force-light {
  --bg: #ffffff; --paper: #ffffff; --ink: #212b32; --muted: #4c6272; --line: #d8dde0; --line-strong: #aeb7bd; --rule: #212b32;
  --accent: #005eb8; --accent-strong: #003087; --on-accent: #ffffff; --accent-soft: #e8edee; --tint: #e0ecf7;
  --gap: #d5281b; --gap-soft: rgba(213, 40, 27, 0.13); --good: #007f3b; --good-dark: #00401e; --warn: #ffb81c; --warn-ink: #6b4c00;
  --field: #ffffff; color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
/* NHS focus: yellow fill with a dark underline for controls, yellow ring with dark inset for fields */
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 4px solid transparent; background-color: var(--focus) !important; color: var(--focus-ink) !important; box-shadow: 0 -2px var(--focus), 0 4px var(--focus-ink) !important; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 4px solid var(--focus); outline-offset: 0; box-shadow: inset 0 0 0 2px var(--focus-ink); }

/* Header band */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
@media (max-width: 700px) { .topbar { position: static; } }
.masthead { background: var(--accent); color: var(--on-accent); }
.mast-in { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; padding-top: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: -.01em; margin-right: auto; }
.brand-mark { display: inline-grid; place-items: center; width: 40px; height: 28px; background: var(--on-accent); color: var(--accent); font-size: 15px; font-weight: 700; }
.brand small { display: block; font-weight: 400; font-size: 14px; opacity: .9; letter-spacing: 0; }
.tabs { display: flex; gap: 2px; }
.tabs button { border: 0; background: transparent; color: var(--on-accent); padding: 10px 16px 12px; cursor: pointer; font-weight: 700; font-size: 16px; border-bottom: 4px solid transparent; }
.tabs button:hover { text-decoration: underline; }
.tabs button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-bottom-color: var(--paper); }

/* Toolbar under the band */
.toolbar { background: var(--paper); border-bottom: 1px solid var(--line); }
.tool-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.picker { display: flex; align-items: center; gap: 8px; flex: 1 1 280px; min-width: 0; }
.picker label { font-weight: 700; white-space: nowrap; }
.picker select { flex: 1 1 auto; min-width: 0; max-width: 420px; }
.tool-end { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

/* NHS buttons: square, bold, hard bottom shadow */
.btn { position: relative; border: 0; border-radius: 4px; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 16px; line-height: 1.25; white-space: nowrap; background: #4c6272; color: #ffffff; box-shadow: 0 4px 0 #263139; margin-bottom: 4px; }
.btn:hover { background: #384853; }
.btn:active { top: 4px; box-shadow: none; }
.btn.primary { background: var(--good); box-shadow: 0 4px 0 var(--good-dark); }
.btn.primary:hover { background: #00662f; }
.btn.reverse { background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 var(--muted); }
.btn.reverse:hover { background: var(--accent-soft); }
.btn.small { padding: 5px 10px; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: none; margin: 0; padding: 4px 6px; text-decoration: underline; font-weight: 400; }
.btn.ghost:hover { background: transparent; color: var(--accent-strong); text-decoration-thickness: 3px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.danger { background: var(--gap); box-shadow: 0 4px 0 #6b140e; }

select, input[type="text"], input[type="number"], input[type="date"], textarea {
  background: var(--field); border: 2px solid var(--muted); border-radius: 0; padding: 6px 8px; width: 100%; min-width: 0; font-size: 16px; min-height: 40px;
}
textarea { resize: vertical; min-height: 72px; line-height: 1.45; }
.status { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.status.warn { color: var(--ink); background: #fff4cc; padding: 2px 6px; }
.status.ok { color: var(--good); font-weight: 700; }

/* NHS inset text */
.notice { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; background: var(--paper); border-left: 10px solid var(--accent); padding: 14px 18px; }
.notice p { margin: 0; max-width: 70ch; }

/* Workspace */
.wrap { padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.work { display: grid; gap: 24px; align-items: start; }
.work.editing { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1180px) {
  .work.editing { grid-template-columns: 460px minmax(0, 1fr); }
  .work.editing .form { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 140px); max-height: calc(100vh - 160px); overflow-y: auto; }
}
.preview-wrap { min-width: 0; container-type: inline-size; }

/* Form: NHS expanders */
.form { display: grid; gap: 8px; min-width: 0; }
.form details { background: var(--paper); border: 1px solid var(--line); border-bottom-width: 4px; }
.form summary { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; list-style: none; font-weight: 700; font-size: 18px; color: var(--accent); }
.form summary .ttl { text-decoration: underline; text-underline-offset: 3px; }
.form summary:hover .ttl { text-decoration-thickness: 3px; }
.form summary::-webkit-details-marker { display: none; }
.form summary::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 7px 0 7px 12px; border-color: transparent transparent transparent currentColor; flex: none; }
.form details[open] summary::before { border-width: 12px 7px 0 7px; border-color: currentColor transparent transparent transparent; }
.form summary .tag { margin-left: auto; }
.fbody { display: grid; gap: 16px; padding: 0 16px 20px 40px; }
.prompt { margin: 0; color: var(--ink); border-left: 8px solid var(--line-strong); padding: 4px 0 4px 14px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 16px; font-weight: 700; color: var(--ink); }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.tbl { display: grid; gap: 10px; }
.trow { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--bg); }
.trow .tcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.trow-head { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700; color: var(--ink); }
.check { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.check input { width: 24px; height: 24px; accent-color: var(--accent); }
.hint { font-size: 14px; color: var(--muted); }
.fbody .hint { margin: -8px 0 0; }
/* Coach notes as an NHS warning callout */
.coach { position: relative; margin-top: 10px; padding: 26px 16px 12px; background: #fff9c4; color: #212b32; border: 1px solid #ffeb3b33; font-size: 15px; }
.coach:empty { display: none; }
.coach b { position: absolute; top: -12px; left: -1px; background: var(--warn); color: #212b32; padding: 2px 10px; font-size: 15px; }
.coach ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.coach li.ok { list-style: "✓  "; }
.coach li.flag { list-style: "!  "; font-weight: 700; }
.num { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 700; flex: none; }
/* NHS tags */
.tag { display: inline-block; font-size: 13px; font-weight: 700; line-height: 1.2; padding: 3px 7px; border: 1px solid currentColor; color: var(--accent-strong); background: var(--tint); white-space: nowrap; }
.tag.do { color: #00401e; background: #cce5d8; }
.tag.check { color: #4c4000; background: #fff9c4; }
.tag.learn { color: #330072; background: #e6dcef; }
.form summary .num { font-size: 15px; }

/* The A3 sheet: a ruled engineering drawing */
.sheet { background: var(--paper); color: var(--ink); border: 1px solid var(--line-strong); padding: 24px; display: grid; gap: 18px; min-width: 0; }
.tblock { display: grid; grid-template-columns: minmax(0, 1fr); border: 2px solid var(--rule); }
.tblock-title { padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.tblock-title small { font-size: 14px; font-weight: 700; color: var(--accent); }
.tblock-title h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 3.8cqi, 40px); line-height: 1.1; letter-spacing: -.015em; text-wrap: balance; overflow-wrap: anywhere; }
.tblock-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 2px solid var(--rule); }
.meta { padding: 6px 12px; min-width: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.meta:nth-child(2n) { border-right: 0; }
.meta:nth-last-child(-n+2) { border-bottom: 0; }
.meta small { display: block; font-size: 12px; color: var(--muted); }
.meta div { overflow-wrap: anywhere; font-size: 15px; font-weight: 700; }
.halves { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.half { display: grid; gap: 18px; align-content: start; min-width: 0; }
.half-label { display: flex; align-items: baseline; gap: 10px; font-size: 15px; color: var(--muted); border-bottom: 2px solid var(--rule); padding-bottom: 4px; }
.half-label b { color: var(--ink); font-size: 17px; }
.box { border: 1px solid var(--line-strong); min-width: 0; display: grid; align-content: start; background: var(--paper); }
.box-h { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 0; border-bottom: 1px solid var(--line-strong); }
.box-h .num { min-width: 36px; height: 36px; font-size: 17px; }
.box-h h2 { margin: 0; font-family: var(--f-display); font-size: 18px; font-weight: 700; color: var(--ink); }
.box-h .tag { margin-left: auto; }
.box-h .cbtn { border: 0; background: transparent; font-size: 14px; padding: 2px 4px; cursor: pointer; color: var(--accent); text-decoration: underline; }
.box-b { padding: 12px 14px 14px; display: grid; gap: 12px; min-width: 0; container-type: inline-size; }
.box-b p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.lbl { font-size: 13px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 2px; }
.ps { border-left: 6px solid var(--gap); padding: 2px 0 2px 12px; font-weight: 700; }
.goal-st { border-left: 6px solid var(--good); padding: 2px 0 2px 12px; font-weight: 700; }
.empty { color: var(--muted); font-style: italic; font-size: 15px; }
.kpi { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
.kpi .big { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .unit { font-size: 14px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--f-body); font-size: 11px; fill: var(--ink); }
.chart .t-ink { fill: var(--ink); }
.chart .t-gap { fill: var(--ink); }
.chart .t-good { fill: var(--ink); font-weight: 700; }
.chart .t-acc { fill: var(--accent); }
.chart .grid { stroke: var(--line); stroke-width: 1; fill: none; }
.chart .axis { stroke: var(--rule); stroke-width: 1; fill: none; }
.chart .std { stroke: var(--good); stroke-width: 1.8; stroke-dasharray: 6 4; fill: none; }
.chart .tgt { stroke: var(--good); stroke-width: 1.8; stroke-dasharray: 6 4; fill: none; }
.chart .base { stroke: var(--line-strong); stroke-width: 1.2; stroke-dasharray: 2 3; fill: none; }
.chart .act { stroke: var(--accent); stroke-width: 2.6; fill: none; }
.chart .pred { stroke: var(--muted); stroke-width: 1.8; stroke-dasharray: 6 4; fill: none; }
.chart .dot { fill: var(--accent); stroke: var(--paper); stroke-width: 1.5; }
.chart .dot-end { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
.chart .gapfill { fill: var(--gap-soft); stroke: none; }
.chart .bone { stroke: var(--line-strong); stroke-width: 1.4; fill: none; }
.chart .spine { stroke: var(--ink); stroke-width: 2; fill: none; }
.chart .head { fill: var(--gap-soft); stroke: var(--gap); stroke-width: 1.4; }
.chart .quad { fill: var(--paper); stroke: var(--line); stroke-width: 1; }
.chart .quad-win { fill: var(--tint); stroke: var(--line); stroke-width: 1; }
.chart .pt { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
.chart .pt-on { fill: var(--accent); stroke: var(--accent); stroke-width: 2; }
.chart .pt-label { font-size: 11px; font-weight: 700; }
.chart .b-track { fill: var(--accent-soft); stroke: var(--line); }
.chart .b-band { fill: var(--gap-soft); }
.chart .b-bar { fill: var(--accent); }
.chart .b-tgt { stroke: var(--good); stroke-width: 3; }
.chart .b-base { stroke: var(--ink); stroke-width: 2; }
.chart .g-row { fill: var(--accent-soft); }
.chart .g-done { fill: var(--good); }
.chart .g-prog { fill: var(--accent); }
.chart .g-not { fill: var(--paper); stroke: var(--line-strong); stroke-width: 1.2; }
.chart .g-late { fill: var(--gap); }
.chart .today { stroke: var(--gap); stroke-width: 1.2; stroke-dasharray: 3 3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-right: 6px; }
.legend i.std { border-top: 2px dashed var(--good); }
.legend i.pred { border-top: 2px dashed var(--muted); }
.legend i.gapk { height: 10px; border: 0; background: var(--gap-soft); }
.legend i.sq { width: 11px; height: 11px; border: 0; }
.whys { display: grid; gap: 0; }
.why { display: grid; grid-template-columns: 58px minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.why:first-child { border-top: 1px solid var(--line); }
.why .wn { display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--accent-strong); background: var(--tint); }
.why .wt { padding: 6px 10px; font-size: 15px; overflow-wrap: anywhere; }
.why .we { display: block; font-size: 13px; color: var(--muted); }
.why.root .wn { background: var(--accent-strong); color: #ffffff; }
.rc { border: 2px solid var(--rule); padding: 8px 12px; font-weight: 700; overflow-wrap: anywhere; }
/* NHS tables: rules between rows, no boxes */
.cm-table, .res-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.cm-table th, .cm-table td, .res-table th, .res-table td { border-bottom: 1px solid var(--line); padding: 6px 8px 6px 0; text-align: left; vertical-align: top; overflow-wrap: break-word; }
.cm-table { min-width: 340px; }
.res-table { min-width: 420px; }
.scroll-x > .chart { min-width: 380px; }
.cm-table th, .res-table th { font-size: 13px; color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--rule); }
.cm-table td.n { font-weight: 700; color: var(--accent); width: 26px; }
.cm-table tr.off td { color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; color: var(--accent-strong); background: var(--tint); }
.pill.cont { color: #4c4000; background: #fff9c4; }
.pill.perm { color: var(--accent-strong); background: var(--tint); }
.pill.done { color: #00401e; background: #cce5d8; }
.pill.prog { color: var(--accent-strong); background: var(--tint); }
.pill.late { color: #6b140e; background: #f7d4d1; }
.two { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.scroll-x { overflow-x: auto; min-width: 0; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-size: 13px; color: var(--muted); border-top: 2px solid var(--rule); padding-top: 8px; }
.foot b { color: var(--ink); }

/* Section 8: Insights */
.insight-head { margin: 0; background: var(--accent-strong); color: #ffffff; padding: 14px 16px; font-size: 20px; line-height: 1.3; font-weight: 700; text-wrap: pretty; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 0; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--line); }
.stat { padding: 8px 10px 10px; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .v { display: block; white-space: nowrap; font-size: 23px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .k { display: block; font-size: 12.5px; color: var(--muted); }
.meter { height: 6px; background: var(--accent-soft); margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--good); }

@container (min-width: 620px) {
  .tblock { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  .tblock-meta { border-top: 0; border-left: 2px solid var(--rule); }
}
@container (min-width: 900px) {
  .halves { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
@container (min-width: 560px) {
  .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .two.cm { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
}

/* Poster: a fixed A3 landscape canvas (420 x 297 mm at 96 dpi) */
.poster-stage { min-width: 0; }

<script>
(() => {
"use strict";

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;
const fmt = (v) => v === null ? "–" : (Math.round(v * 10) / 10).toLocaleString();
const uid = () => "a" + Math.random().toString(36).slice(2, 9);
const LS_KEY = "a3wb-draft-v1";
const LS_MODE = "a3wb-mode";
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
const parseDate = (s) => { if (!s) return null; const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
const fmtDate = (s) => { const d = parseDate(s); return d ? d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : ""; };
const today = () => new Date().toISOString().slice(0, 10);

function blankA3() {
  return {
    id: uid(), example: false, title: "", owner: "", mentor: "", team: "", date: today(), revision: "1",
    background: "", strategicLink: "",
    metric: { name: "", unit: "", better: "lower", standard: null },
    currentText: "", problemStatement: "", current: [{ label: "", value: null }],
    goal: { statement: "", baseline: null, target: null, current: null, deadline: "" },
    rcaTool: "whys", whys: [{ why: "", evidence: "" }], rootCauses: "",
    fishbone: { Method: "", Machine: "", People: "", Material: "", Measurement: "", Environment: "" },
    countermeasures: [{ name: "", cause: "", kind: "Permanent", effect: 3, effort: 3, chosen: true }],
    tasks: [{ task: "", owner: "", start: "", end: "", status: "Not started" }],
    results: [{ label: "", predicted: null, actual: null }],
    followup: { checkPlan: "", checkDate: "", standardize: "", yokoten: "", lessons: "" },
    insights: { headline: "", surprised: "", differently: "", nextStep: "" }
  };
}
function normalize(a) { // fill any missing fields so older data keeps working
  const b = blankA3();
  const out = Object.assign({}, b, a || {});
  for (const k of ["metric", "goal", "fishbone", "followup", "insights"]) out[k] = Object.assign({}, b[k], (a || {})[k] || {});
  for (const k of ["current", "whys", "countermeasures", "tasks", "results"]) if (!Array.isArray(out[k])) out[k] = b[k];
  return out;
}

/* ---------- state ---------- */
let store = { version: 1, activeId: null, a3s: [] };
let mode = "present";
let canEdit = false;
let saver = null;          // the artifact namespace, when this view can publish
let comments = null;
let dirty = false;
let saving = false;
let saveTimer = null;
let canSaveRemote = true;
const active = () => store.a3s.find(a => a.id === store.activeId) || store.a3s[0];

/* ---------- section definitions (from the A3 knowledge base) ---------- */
const SECTIONS = [
  { n: 1, key: "background", title: "Background", phase: "Plan", prompt: "Why does this problem matter, and to whom? Tie it to a business goal or KPI and say why now." },
  { n: 2, key: "current", title: "Current condition", phase: "Plan", prompt: "What is happening today, and what should be happening? How often does it go wrong, and how do you know? Go and see (gemba)." },
  { n: 3, key: "goal", title: "Goal", phase: "Plan", prompt: "What would success look like, in numbers, and by when? Use the same metric as the current condition." },
  { n: 4, key: "rca", title: "Root cause analysis", phase: "Plan", prompt: "Why does the gap exist? Ask why several times, check each answer against facts, and blame conditions, not people." },
  { n: 5, key: "cm", title: "Countermeasures", phase: "Plan", prompt: "For each root cause, what could you change? Compare two or three options on effect and effort. Keep containment separate from permanent fixes." },
  { n: 6, key: "plan", title: "Implementation plan", phase: "Do", prompt: "What needs to happen, who owns each step, and when will it be done? Every task needs one owner and a date." },
  { n: 7, key: "follow", title: "Follow-up", phase: "Check · Act", prompt: "How will you know it worked, and when will you check? Compare predicted and actual on the goal metric. How will you sustain and share it?" },
  { n: 8, key: "insights", title: "Insights", phase: "Learn", extra: true, prompt: "What is the one thing a colleague should take away from this A3? Write it as a sentence they could repeat. Then note what surprised you, what you would do differently and what happens next." }
];
const phaseClass = (p) => p === "Do" ? "do" : p === "Check · Act" ? "check" : p === "Learn" ? "learn" : "";
const CHECK_KEYS = ["header", "background", "current", "goal", "rca", "cm", "plan", "follow", "insights"];

/* ---------- coaching checks (common mistakes from the knowledge base) ---------- */
const SOLUTION_WORDS = /\b(implement|buy|install|purchase|new system|deploy|introduce|roll out|rollout)\b/i;
const LACK_WORDS = /\b(lack of|no |need more|insufficient|not enough)\b/i;
const BLAME_WORDS = /\b(human error|careless|lazy|didn't follow|did not follow|operator error|staff error)\b/i;
const TRAINING_WORDS = /\b(train|training|retrain|remind|reminder|awareness)\b/i;
function checks(a, key) {
  const out = [];
  const ok = (t) => out.push(["ok", t]);
  const flag = (t) => out.push(["flag", t]);
  if (key === "header") {
    if (!a.title) flag("Name the problem in a few words.");
    else if (SOLUTION_WORDS.test(a.title)) flag("The title sounds like a solution. Name the problem instead.");
    else ok("Title names a problem.");
    if (!a.owner) flag("Add one owner.");
  }
  if (key === "background") {
    if (!a.background) flag("Say why this matters and to whom.");
    if (!a.strategicLink) flag("Link it to a business goal or KPI.");
    else ok("Linked to a business goal.");
  }
  if (key === "current") {
    const pts = a.current.filter(p => num(p.value) !== null);
    if (!a.metric.name) flag("Name the metric you will track through to follow-up.");
    if (num(a.metric.standard) === null) flag("Add the standard or expected level, so the gap shows.");
    if (pts.length < 3) flag("Add at least three data points to show the trend.");
    else ok(`${pts.length} data points charted.`);
    if (a.problemStatement && LACK_WORDS.test(a.problemStatement)) flag("The problem is stated as a lack of something. Describe the gap instead.");
    if (a.problemStatement && SOLUTION_WORDS.test(a.problemStatement)) flag("The problem statement assumes a fix.");
    if (!/\d/.test(a.problemStatement + a.currentText)) flag("Use numbers: the gap in time, %, count or cost.");
    if (!/gemba|observ|walk|went to|saw/i.test(a.currentText)) flag("Note what you observed first-hand (gemba).");
  }
  if (key === "goal") {
    const g = a.goal;
    if (num(g.baseline) === null || num(g.target) === null) flag("Add a baseline and a target number.");
    if (!g.deadline) flag("Add a deadline.");
    if (g.statement && !/\d/.test(g.statement)) flag("The goal has no number, so it may be a countermeasure.");
    if (num(g.baseline) !== null && num(g.target) !== null && g.deadline) ok("Goal has a metric, baseline, target and deadline.");
  }
  if (key === "rca") {
    const w = a.whys.filter(x => x.why.trim());
    if ((a.rcaTool === "whys" || a.rcaTool === "both") && w.length < 3) flag("Ask why at least three times.");
    if (w.length && w.some(x => !x.evidence.trim())) flag("Add evidence for each why.");
    if (BLAME_WORDS.test(w.map(x => x.why).join(" ") + " " + a.rootCauses)) flag("A cause blames people. Ask what in the system allowed it.");
    if (!a.rootCauses.trim()) flag("State the verified root cause.");
    if (w.length >= 3 && w.every(x => x.evidence.trim())) ok("Why chain has evidence at each step.");
  }
  if (key === "cm") {
    const c = a.countermeasures.filter(x => x.name.trim());
    if (c.length < 2) flag("Compare at least two options.");
    if (c.some(x => !x.cause.trim())) flag("Link every countermeasure to a root cause.");
    if (c.length && c.every(x => TRAINING_WORDS.test(x.name))) flag("Training alone rarely holds. Look for a change to the process.");
    if (c.length >= 2 && c.every(x => x.cause.trim())) ok("Options compared and linked to causes.");
  }
  if (key === "plan") {
    const t = a.tasks.filter(x => x.task.trim());
    if (!t.length) flag("Add the tasks.");
    if (t.some(x => !x.owner.trim() || !x.end)) flag("Every task needs an owner and a due date.");
    else if (t.length) ok("Every task has an owner and a date.");
  }
  if (key === "follow") {
    const f = a.followup;
    if (!f.checkDate) flag("Set a date to check results.");
    if (!a.results.some(r => num(r.predicted) !== null)) flag("Add predicted results on the goal metric.");
    if (!f.standardize.trim()) flag("Say how the change will be standardized.");
    if (!f.yokoten.trim()) flag("Name who else should learn from this (yokoten).");
    if (f.checkDate && f.standardize.trim() && f.yokoten.trim()) ok("Check, sustain and share are planned.");
  }
  if (key === "insights") {
    const n = a.insights;
    if (!n.headline.trim()) flag("Write the one key insight as a full sentence.");
    else if (n.headline.trim().split(/\s+/).length < 6) flag("The key insight is very short. Say what you learned, not just the topic.");

/* ---------- charts (inline SVG, colors from tokens) ---------- */
function niceRange(vals, pad = 0.12) {

}
function niceStep(raw) {

function computeInsights(a) {

  const base = num(a.goal.baseline), tgt = num(a.goal.target);
  const curVals = a.current.map(p => num(p.value)).filter(v => v !== null);
  const actVals = a.results.map(r => num(r.actual)).filter(v => v !== null);
  let latest = null, latestFrom = "";
  const lastRes = [...a.results].reverse().find(r => num(r.actual) !== null);
  if (lastRes) { latest = num(lastRes.actual); latestFrom = lastRes.label; }
  else if (num(a.goal.current) !== null) { latest = num(a.goal.current); latestFrom = "goal"; }
  else if (curVals.length) { latest = curVals[curVals.length - 1]; latestFrom = "current"; }
  let gap = null;
  if (base !== null && tgt !== null && latest !== null && base !== tgt) gap = (base - latest) / (base - tgt);
  // trend: the current-condition run continued by actual results, last three points
  const run = curVals.concat(actVals).slice(-3);
  let trend = null;
  if (run.length >= 2) {
    const d = run[run.length - 1] - run[0];
    const span = Math.max(...curVals.concat(actVals)) - Math.min(...curVals.concat(actVals)) || 1;
    if (Math.abs(d) < span * 0.1) trend = { word: "Flat", arrow: "→", good: null };
    else {
      const up = d > 0;
      const good = better === "higher" ? up : !up;
      trend = { word: good ? "Improving" : "Worsening", arrow: up ? "↑" : "↓", good };
    }
  }
  const t = a.tasks.filter(x => x.task.trim());
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const done = t.filter(x => x.status === "Done").length;
  const overdue = t.filter(x => x.status !== "Done" && parseDate(x.end) && parseDate(x.end) < now).length;
  const clear = CHECK_KEYS.filter(k => !checks(a, k).some(c => c[0] === "flag")).length;
  return { latest, latestFrom, gap, trend, tasks: t.length, done, overdue, clear, of: CHECK_KEYS.length };
}

// Boxes 1 to 8 go into three columns in reading order (down each column, left to right).
// Try the most even splits, and keep the one that allows the largest type and charts.
function layoutPoster(el) {
  const cols = [...el.querySelectorAll(".pcol")];
  const boxes = [...el.querySelectorAll(".pcol > .box")];
  const n = boxes.length;
  el.style.setProperty("--pfs", 13); el.style.setProperty("--pch", 220);
  boxes.forEach(b => { b.style.flex = "none"; });
  const h = boxes.map(b => b.getBoundingClientRect().height);
  boxes.forEach(b => { b.style.flex = ""; });
  const gap = 12;
  const sum = (i, j) => h.slice(i, j).reduce((t, v) => t + v + gap, 0);
  const splits = [];
  for (let i = 1; i < n - 1; i++) for (let j = i + 1; j < n; j++) splits.push({ i, j, cost: Math.max(sum(0, i), sum(i, j), sum(j, n)) });
  splits.sort((x, y) => x.cost - y.cost);
  const place = (sp) => boxes.forEach((b, k) => cols[k < sp.i ? 0 : k < sp.j ? 1 : 2].appendChild(b));
  let best = null;
  for (const sp of splits.slice(0, 4)) {
    place(sp);
    const r = fitPoster(el);
    if (!best || r.fs > best.fs || (r.fs === best.fs && r.ch > best.ch)) best = Object.assign(r, { sp });
  }
  if (best) { place(best.sp); fitPoster(el); }
}
// Largest type and charts that let every column fit on the page.
function fitPoster(el) {
  const cols = [...el.querySelectorAll(".pcol")];
  const over = () => cols.some(c => c.scrollHeight > c.clientHeight + 1);
  const set = (k, v) => el.style.setProperty(k, v);
  let fs = 18, ch = 300;
  set("--pfs", fs); set("--pch", ch);
  while (over() && fs > 13) { fs -= 0.5; set("--pfs", fs); }
  while (over() && ch > 170) { ch -= 10; set("--pch", ch); }
  while (over() && fs > 11) { fs -= 0.5; set("--pfs", fs); }
  while (over() && ch > 130) { ch -= 10; set("--pch", ch); }
  while (over() && fs > 8) { fs -= 0.5; set("--pfs", fs); }
  const bad = over();
  el.dataset.fit = fs + "/" + ch + (bad ? "/over" : "");
  return { fs, ch, bad };
}

function scalePoster(el = $("#posterFrame .poster"), frame = $("#posterFrame")) {
  if (!el) return;

      `<div class="field"><span>Data points (oldest first)</span>${tableEditor("current", a.current, [{ k: "label", label: "Period", ph: "e.g. Jun" }, { k: "value", label: "Value", type: "num" }], "Add data point", "Point")}</div>` +
      txt("currentText", "What you observed", a.currentText, "Facts from the gemba: where, when, how often", 4) + coachBox(a, "current")) +
    d("goal", sh(S.goal),
      `<p class="prompt">${esc(S.goal.prompt)}</p>` + txt("goal.statement", "Goal statement", a.goal.statement, "Cut X from 85 to 45 by 31 March", 2) +
      `<div class="row2">${numIn("goal.baseline", "Baseline", a.goal.baseline)}${numIn("goal.current", "Current", a.goal.current)}${numIn("goal.target", "Target", a.goal.target)}</div>` +
      dateIn("goal.deadline", "Deadline", a.goal.deadline) + coachBox(a, "goal")) +
    d("rca", sh(S.rca),
      `<p class="prompt">${esc(S.rca.prompt)}</p>` +
      sel("rcaTool", "Show on the A3", a.rcaTool, [["whys", "5 Whys"], ["fishbone", "Fishbone"], ["both", "5 Whys and fishbone"]]) +
      `<div class="field"><span>5 Whys (start at the point of occurrence)</span>${tableEditor("whys", a.whys, [{ k: "why", label: "Why?", wide: true }, { k: "evidence", label: "Evidence", wide: true }], "Ask why again", "Why")}</div>` +
      `<div class="field"><span>Fishbone causes (one per line)</span><div class="row2">${FISH.map(k => `<label class="field"><span>${k}</span><textarea rows="2" id="f-fb-${k}" data-p="fishbone.${k}">${esc(a.fishbone[k])}</textarea></label>`).join("")}</div></div>` +
      txt("rootCauses", "Verified root cause(s)", a.rootCauses, "One to three causes, backed by evidence", 2) + coachBox(a, "rca")) +
    d("cm", sh(S.cm),
      `<p class="prompt">${esc(S.cm.prompt)}</p>` +
      tableEditor("countermeasures", a.countermeasures, [
        { k: "name", label: "Countermeasure", wide: true }, { k: "cause", label: "Root cause it addresses", wide: true },
        { k: "kind", label: "Type", type: "sel", opts: ["Permanent", "Containment"] },
        { k: "effect", label: "Effect 1–5", type: "sel", opts: [1, 2, 3, 4, 5], num: true },
        { k: "effort", label: "Effort 1–5", type: "sel", opts: [1, 2, 3, 4, 5], num: true },
        { k: "chosen", label: "Chosen", type: "bool" }], "Add option", "Option") + coachBox(a, "cm")) +
    d("plan", sh(S.plan),
      `<p class="prompt">${esc(S.plan.prompt)}</p>` +
      tableEditor("tasks", a.tasks, [
        { k: "task", label: "Task", wide: true }, { k: "owner", label: "Owner" },
        { k: "status", label: "Status", type: "sel", opts: ["Not started", "In progress", "Done"] },
        { k: "start", label: "Start", type: "date" }, { k: "end", label: "Due", type: "date" }], "Add task", "Task") + coachBox(a, "plan")) +
    d("follow", sh(S.follow),
      `<p class="prompt">${esc(S.follow.prompt)}</p>` +
      `<div class="field"><span>Predicted vs actual (same metric as the goal)</span>${tableEditor("results", a.results, [{ k: "label", label: "Period" }, { k: "predicted", label: "Predicted", type: "num" }, { k: "actual", label: "Actual", type: "num" }], "Add period", "Period")}</div>` +
      txt("followup.checkPlan", "How and when you will check", a.followup.checkPlan, "", 2) + dateIn("followup.checkDate", "Check date", a.followup.checkDate) +
      txt("followup.standardize", "Standardize", a.followup.standardize, "Standard work, checklists, visual controls", 2) +
      txt("followup.yokoten", "Share with (yokoten)", a.followup.yokoten, "Other teams or sites with the same problem", 2) +
      txt("followup.lessons", "Lessons learned", a.followup.lessons, "", 2) + coachBox(a, "follow")) +
    d("insights", sh(S.insights),
      `<p class="prompt">${esc(S.insights.prompt)}</p>` +
      `<p class="hint">Section 8 adds to the standard seven boxes. The key insight runs across the top of the poster and the PDF.</p>` +
      txt("insights.headline", "Key insight", a.insights.headline, "The one sentence a colleague should remember", 3) +
      `<div class="field"><span>Worked out from your A3</span><div data-ins>${statTiles(computeInsights(a), a.metric.unit)}</div></div>` +
      txt("insights.surprised", "What surprised you", a.insights.surprised, "", 3) +
      txt("insights.differently", "What you would do differently", a.insights.differently, "", 3) +
      txt("insights.nextStep", "Next step", a.insights.nextStep, "What happens next, and who owns it", 3) + coachBox(a, "insights")) +
    `<div class="fbody" style="padding-top:14px">
       <div id="delZone"><button type="button" class="btn ghost small" id="delA3">Delete this A3</button></div>
     </div>`;
}
function refreshCoach() {
  const a = active();
  document.querySelectorAll("[data-coach]").forEach(el => { el.innerHTML = coachInner(a, el.dataset.coach); });
  const ins = document.querySelector("[data-ins]");
  if (ins) ins.innerHTML = statTiles(computeInsights(a), a.metric.unit);
}

function setPath(obj, path, val) {
  const parts = path.split(".");
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = val;
}

/* ---------- rendering and modes ---------- */
let renderTimer = null;
function renderAll() {
  renderPicker();
  renderSheet(active(), $("#sheet"));
  renderNotices();
  if (mode === "edit") renderForm();
  if (mode === "poster") showPoster();
  if (mode === "home") renderHome();
}
function scheduleSheet() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { renderSheet(active(), $("#sheet")); refreshCoach(); renderPicker(); }, 120);
}
function renderPicker() {
  const p = $("#a3pick");
  const v = store.activeId;
  p.innerHTML = store.a3s.map(a => `<option value="${esc(a.id)}"${a.id === v ? " selected" : ""}>${esc(a.title || "Untitled A3")}${a.example ? " (example)" : ""}</option>`).join("");
}
function renderNotices() {
  const a = active();
  const n = $("#notices");
  let h = "";
  if (a && a.example) {
    h += `<div class="notice"><p><b>This is an example A3.</b> It shows how a finished A3 reads. ${canEdit ? "Start your own, or edit this one to learn the layout." : ""}</p>${canEdit ? `<button type="button" class="btn primary small" id="startOwn">Start my own A3</button>` : ""}</div>`;
  }
  n.innerHTML = h;
  n.hidden = !h;
}
function setMode(m) {
  mode = m === "home" || m === "poster" ? m : (m === "edit" && canEdit) ? "edit" : "present";
  lsSet(LS_MODE, mode);
  $("#modeHome").setAttribute("aria-pressed", String(mode === "home"));
  $("#home").hidden = mode !== "home";
  $("#app").hidden = mode === "home";
  $("#toolbar").hidden = mode === "home";
  if (mode === "home") renderHome(); else $("#home").innerHTML = "";
  $("#modeEdit").setAttribute("aria-pressed", String(mode === "edit"));
  $("#modePresent").setAttribute("aria-pressed", String(mode === "present"));
  $("#modePoster").setAttribute("aria-pressed", String(mode === "poster"));
  $("#form").hidden = mode !== "edit";
  $("#sheetWrap").hidden = mode === "poster";
  $("#posterStage").hidden = mode !== "poster";
  $("#work").classList.toggle("editing", mode === "edit");
  $("#saveBtn").hidden = !(canEdit && mode === "edit");
  if (mode === "edit") renderForm();
  if (mode === "poster") showPoster(); else $("#posterFrame").innerHTML = "";
}

/* ---------- saving ---------- */
function setStatus(t, cls = "") { const s = $("#status"); s.textContent = t; s.className = "status " + cls; }
function markDirty() {
  dirty = true;
  lsSet(LS_KEY, JSON.stringify({ dirty: true, store }));
  setStatus(canSaveRemote && saver ? "Unsaved changes" : "Changes kept in this browser", "warn");
  clearTimeout(saveTimer);
  if (saver && canSaveRemote) saveTimer = setTimeout(save, 4000);
}
async function save() {
  clearTimeout(saveTimer);
  if (!dirty) { setStatus("All changes saved", "ok"); return; }
  if (!saver || !canSaveRemote) { setStatus("Saving to the shared page isn't available here. Changes stay in this browser.", "warn"); return; }
  if (saving) { saveTimer = setTimeout(save, 1500); return; }
  saving = true;
  const snapshot = JSON.stringify(store, null, 1);
  setStatus("Saving…");
  try {
    await saver.publish({ "a3.json": { content: snapshot, contentType: "application/json" } });
    if (JSON.stringify(store, null, 1) === snapshot) { dirty = false; lsDel(LS_KEY); }
    const t = new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    setStatus(dirty ? "Unsaved changes" : `Saved ${t} · colleagues see this version`, dirty ? "warn" : "ok");
    if (dirty) saveTimer = setTimeout(save, 3000);
  } catch (e) {
    const code = e && e.code;
    if (code === "conflict") setStatus("Someone saved a newer version. Reloading to it; your changes are kept in this browser.", "warn");
    else if (code === "not_writer" || code === "not_granted") { canSaveRemote = false; setStatus("You can view this A3 but not save to it. Changes stay in this browser.", "warn"); }
    else if (code === "capability_disabled") { canSaveRemote = false; setStatus("Saving isn't available in this view. Changes stay in this browser.", "warn"); }
    else setStatus("Couldn't save just now. Your changes are kept in this browser; try Save again.", "warn");
  } finally { saving = false; }
}

/* ---------- PDF export ---------- */
// The PDF libraries load only when someone downloads a PDF. Each is pinned to an
// exact npm release and checked against its hash (Subresource Integrity), so the
// browser refuses a file that was changed on the CDN.
const PDF_LIBS = {
  html2canvas: { src: "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js", integrity: "sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" },
  jspdf: { src: "https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js", integrity: "sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3" }
};
function loadScript({ src, integrity }) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement("script");
    s.src = src; s.integrity = integrity; s.crossOrigin = "anonymous"; s.referrerPolicy = "no-referrer";
    s.onload = res; s.onerror = () => rej(new Error("load " + src));
    document.head.appendChild(s);
  });
}
const SVG_PROPS = ["fill", "stroke", "stroke-width", "stroke-dasharray", "opacity", "font-size", "font-family", "font-weight"];
function inlineSvgStyles(root) {
  root.querySelectorAll("svg *").forEach(el => {
    const cs = getComputedStyle(el);
    SVG_PROPS.forEach(p => { const v = cs.getPropertyValue(p); if (v) el.setAttribute(p, v); });
    el.removeAttribute("class"); el.removeAttribute("style");
  });
  root.querySelectorAll("svg").forEach(svg => {
    const r = svg.getBoundingClientRect();
    svg.setAttribute("width", Math.round(r.width)); svg.setAttribute("height", Math.round(r.height));
  });
}
async function buildPdf() {
  await loadScript(PDF_LIBS.html2canvas);
  await loadScript(PDF_LIBS.jspdf);
  const host = $("#captureHost");
  host.innerHTML = "";
  host.classList.add("force-light");
  try { await document.fonts.ready; } catch (e) {}
  const poster = renderPoster(active(), host);
  inlineSvgStyles(poster);
  // 1587 x 1123 px is A3 landscape at 96 dpi; scale 2.5 gives about 240 dpi on the page.
  const canvas = await window.html2canvas(poster, { scale: 2.5, width: 1587, height: 1123, windowWidth: 1700, backgroundColor: "#ffffff", useCORS: true, logging: false });
  host.innerHTML = "";
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a3", compress: true });
  pdf.addImage(canvas.toDataURL("image/jpeg", 0.93), "JPEG", 0, 0, 420, 297, undefined, "FAST");
  pdf.setProperties({ title: active().title || "A3" });
  return pdf.output("blob");
}
window.__a3buildPdf = buildPdf;
async function downloadPdf() {
  const btn = $("#pdfBtn");
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Preparing PDF…";
  try {
    const blob = await buildPdf();
    const name = (active().title || "A3").replace(/[^\w\- ]+/g, "").trim().slice(0, 80) || "A3";
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) {
      try { await dl.save({ filename: name + " - A3.pdf", data: blob }); toast("PDF saved"); }
      catch (e) { if (e && e.code !== "dismissed" && e.code !== "declined") toast("The PDF couldn't be saved here."); }
    } else if (!window.claude) {
      // Opened as a plain web page (for example from the repository): a normal browser download works.
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url; link.download = name + " - A3.pdf";
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("PDF downloaded");
    } else {
      toast("Downloads aren't available in this view.");
    }
  } catch (e) {
    toast("Couldn't build the PDF. Check your connection and try again.");
  } finally { btn.disabled = false; btn.textContent = label; }
}
let toastTimer;
function toast(t) {
  let el = $(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = t; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}

/* ---------- events ---------- */
$("#form").addEventListener("input", (e) => {
  const el = e.target; const p = el.dataset.p; if (!p) return;
  let v = el.dataset.t === "bool" ? el.checked : el.value;
  if (el.dataset.t === "num") v = num(v);
  const a = active();
  setPath(a, p, v);
  if (a.example) { a.example = false; renderNotices(); }
  markDirty(); scheduleSheet();
});
$("#form").addEventListener("toggle", (e) => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; e.target.open ? openSecs.add(k) : openSecs.delete(k); }, true);
$("#form").addEventListener("submit", (e) => e.preventDefault());
$("#form").addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  const a = active();
  const blank = blankA3();
  if (t.dataset.add) { a[t.dataset.add].push(JSON.parse(JSON.stringify(blank[t.dataset.add][0]))); }
  else if (t.dataset.del) { const [k, i] = t.dataset.del.split(":"); a[k].splice(+i, 1); if (!a[k].length) a[k].push(JSON.parse(JSON.stringify(blank[k][0]))); }
  else if (t.dataset.move) { const [k, i, d] = t.dataset.move.split(":"); const j = +i + +d; [a[k][i], a[k][j]] = [a[k][j], a[k][i]]; }
  else if (t.id === "delA3") {
    $("#delZone").innerHTML = `<div class="confirm"><span>Delete “${esc(a.title || "Untitled A3")}” for everyone?</span><button type="button" class="btn small danger" id="delYes">Delete</button><button type="button" class="btn small reverse" id="delNo">Keep it</button></div>`;
    return;
  } else if (t.id === "delNo") { renderForm(); return; }
  else if (t.id === "delYes") {
    store.a3s = store.a3s.filter(x => x.id !== a.id);
    if (!store.a3s.length) store.a3s.push(blankA3());
    store.activeId = store.a3s[0].id;
    markDirty(); renderAll(); toast("A3 deleted"); return;
  } else return;
  if (a.example) a.example = false;
  markDirty(); renderForm(); scheduleSheet();
});
$("#sheet").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-comment]"); if (!b || !comments) return;
  const sec = b.closest(".box");
  try { await comments.openComposer({ element: sec }); } catch (err) { toast("Comments aren't available in this view."); }
});
$("#notices").addEventListener("click", (e) => {
  if (e.target.id === "startOwn") newA3();
});
function newA3() {
  const n = blankA3(); store.a3s.push(n); store.activeId = n.id;
  openSecs.clear(); openSecs.add("header");
  markDirty(); setMode("edit"); renderAll();
  setTimeout(() => { const f = $("#f-title"); if (f) f.focus(); }, 30);
}
$("#newA3").addEventListener("click", newA3);
$("#a3pick").addEventListener("change", (e) => { store.activeId = e.target.value; renderAll(); });
$("#modeEdit").addEventListener("click", () => { setMode("edit"); renderNotices(); });
$("#modePresent").addEventListener("click", () => setMode("present"));
$("#modePoster").addEventListener("click", () => setMode("poster"));
$("#modeHome").addEventListener("click", () => setMode("home"));
$("#brandHome").addEventListener("click", (e) => { e.preventDefault(); setMode("home"); window.scrollTo(0, 0); });
let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (mode === "poster") scalePoster(); if (mode === "home") scalePoster($("#thumbFrame .poster"), $("#thumbFrame")); }, 80); });
$("#saveBtn").addEventListener("click", save);
$("#pdfBtn").addEventListener("click", downloadPdf);
window.addEventListener("beforeunload", () => { if (dirty) lsSet(LS_KEY, JSON.stringify({ dirty: true, store })); });

/* ---------- boot ---------- */
async function boot() {
  let loaded = null;
  try { const r = await fetch("a3.json", { cache: "no-store" }); if (r.ok) loaded = await r.json(); } catch (e) {}
  if (!loaded || !Array.isArray(loaded.a3s) || !loaded.a3s.length) loaded = { version: 1, activeId: null, a3s: [blankA3()] };
  store = loaded;
  store.a3s = store.a3s.map(normalize);
  if (!store.a3s.find(a => a.id === store.activeId)) store.activeId = store.a3s[0].id;
  renderAll();
  setMode("home");

  const claude = window.claude;
  if (!claude || !claude.use) {
    // Opened outside the claude.ai viewer: allow local editing kept in this browser.
    canEdit = true; canSaveRemote = false;
    showEditing();
    return;
  }
  const [user, art, com] = await Promise.all([claude.use("user"), claude.use("artifact"), claude.use("comments")]);
  comments = com;
  let editor = false;
  try { const c = user ? await user.can("files.write") : null; editor = c === null ? (user ? await user.canEdit() : false) : c; } catch (e) {}
  if (editor && art) { canEdit = true; saver = art; }
  renderSheet(active(), $("#sheet"));
  if (canEdit) showEditing();
}
function showEditing() {
  // An editor's unsaved changes from an earlier visit come back first.
  let restored = false;
  try {
    const d = JSON.parse(lsGet(LS_KEY) || "null");
    if (d && d.dirty && d.store && Array.isArray(d.store.a3s) && d.store.a3s.length) {
      store = d.store; store.a3s = store.a3s.map(normalize);
      if (!store.a3s.find(a => a.id === store.activeId)) store.activeId = store.a3s[0].id;
      restored = true; dirty = true; renderAll();
    }
  } catch (e) {}
  $("#modeEdit").hidden = false;
  $("#newA3").hidden = false;
  renderNotices();
  setMode(mode); // stay on the current view (Home on first load), now with editing turned on
  if (!saver) setStatus("Changes are saved in this browser only", "");
  else if (restored) { setStatus("Restored unsaved changes from this browser", "warn"); if (canSaveRemote) saveTimer = setTimeout(save, 4000); }
}
boot();
})();
